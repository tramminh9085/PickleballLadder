services:
  - type: web
    name: pickleball-ladder
    runtime: docker
    plan: free
    healthCheckPath: /api/players
    envVars:
      - key: JDBC_DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DDL_AUTO
        value: update
      - key: SQL_INIT_MODE
        value: never
