server.port=${PORT:8080}
server.servlet.context-path=/

# H2 locally; set JDBC_DATABASE_URL, DATABASE_USERNAME, and DATABASE_PASSWORD in production
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=${SQL_INIT_MODE:embedded}

# Application
spring.application.name=pickleball-ladder-league
spring.web.resources.static-locations=classpath:/static/
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Logging
logging.level.com.pickleball=DEBUG
logging.level.org.springframework.web=DEBUG
